name: Test canboatjs dependents

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  repository_dispatch:
    types: [trigger-workflow]
  workflow_dispatch:

jobs:
  dependent:
    # One job per dependent, so a broken one is named in its own check and
    # never hides the others behind it.
    name: 'dependents (${{ matrix.repo }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ref:   branch to test (default branch when empty)
        # links: packages to link in (default @canboat/canboatjs); all in one
        #        `npm link`, since a later `npm link` drops the earlier ones
        # build / test: run `npm run build` / `npm test`
        include:
          - repo: SignalK/n2k-signalk
            build: true
            test: true
          - repo: SignalK/signalk-to-nmea2000
            test: true
          - repo: sbender9/signalk-n2k-switching
            links: '@canboat/canboatjs @canboat/ts-pgns'
            build: true
          - repo: sbender9/signalk-n2k-displays
            build: true
          - repo: sbender9/signalk-n2k-switching-emulator
            ref: main
            build: true
          - repo: sbender9/signalk-alarm-silencer
            ref: ts-pgns
            build: true
          - repo: sbender9/signalk-fusion-stereo
            ref: master
            build: true
          - repo: sbender9/signalk-yd-alarm-button
            ref: ts-pgns
            build: true
          - repo: sbender9/signalk-n2kais-to-nmea0183
            build: true
            test: true
          - repo: SignalK/signalk-autopilot
            links: '@canboat/ts-pgns'
            build: true
            test: true
          # Its tests round-trip every conversion through toPgn and FromPgn
          # and check the fields against ts-pgns. No build: that also bundles
          # its webpack panel, and the tests run from src.
          - repo: NearlCrews/signalk-nmea2000-emitter-cannon
            links: '@canboat/canboatjs @canboat/ts-pgns'
            test: true

    steps:
    - name: Checkout canboatjs
      uses: actions/checkout@v4
      with:
        path: ./canboatjs

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Build canboatjs
      # Register canboatjs and the ts-pgns it resolved as the global links, so
      # a dependent's `npm link @canboat/ts-pgns` gets the definitions this
      # canboatjs is tested with rather than whatever npm has as latest.
      run: |
        npm install
        npm run build
        npm link
        (cd node_modules/@canboat/ts-pgns && npm link)
      working-directory: ./canboatjs

    - name: Checkout ${{ matrix.repo }}
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repo }}
        ref: ${{ matrix.ref }}
        path: ./dependent

    - name: Install ${{ matrix.repo }}
      run: |
        npm install
        npm link ${{ matrix.links || '@canboat/canboatjs' }}
      working-directory: ./dependent

    - name: Build ${{ matrix.repo }}
      if: matrix.build
      run: npm run build
      working-directory: ./dependent

    - name: Test ${{ matrix.repo }}
      if: matrix.test
      run: npm test
      working-directory: ./dependent
