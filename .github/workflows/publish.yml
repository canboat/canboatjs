name: Publish to npm
on:
  release:
    types: [created]
  repository_dispatch:
    types: [trigger-workflow]
  workflow_dispatch:
permissions:
  id-token: write  # Required for OIDC
  contents: read
jobs:
  prebuild:
    uses: ./.github/workflows/prebuild.yml

  build:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Install and build 
      run: |
        npm cache clean -f
        npm install
        npm ci && npm cache clean --force
        npm run build

    - name: Add prebuilt native addons
      uses: actions/download-artifact@v4
      with:
        pattern: prebuilds-*
        path: prebuilds
        merge-multiple: true

    - name: Check prebuilt native addons
      # One per platform prebuild.yml builds.
      run: |
        find prebuilds -type f
        test "$(find prebuilds -name '*.node' | wc -l)" -eq 3

    - name: Set tag variable
      id: vars
      run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

    - name: Publish 
      run: |
        npm ci && npm cache clean --force
        if [[ "${{ steps.vars.outputs.tag }}" == *beta* ]];
          then
            npm publish --tag beta
          else
            npm publish --access public
        fi    
